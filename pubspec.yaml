name: esp32_ble_app
description: Flutter app to connect to ESP32-S3 BLE and display BAC UI.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=2.19.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5

  # BLE + charts
  flutter_blue_plus: ^1.34.5
  fl_chart: ^0.70.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
